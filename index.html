<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Casa da Lala" />
    <meta name="theme-color" content="#2E6F5E" />
    <title>Casa da Lala</title>
    <meta name="description" content="App mobile-first iOS de organização pessoal, prontidão atlética, rotina de estudos UERJ, cuidados com pets e finanças com Modo Sobrevivência." />
    <meta property="og:title" content="Casa da Lala" />
    <meta property="og:description" content="App mobile-first iOS de organização pessoal, prontidão atlética, rotina de estudos UERJ, cuidados com pets e finanças com Modo Sobrevivência." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        const CURRENT_SW_VERSION = 'casa-da-lala-offline-v14';
        let isReloadingForSw = false;

        const reloadOnceForUpdate = () => {
          if (isReloadingForSw) return;
          const lastReload = Number(sessionStorage.getItem('lala_sw_reload_ts') || '0');
          if (Date.now() - lastReload < 8000) return;
          isReloadingForSw = true;
          sessionStorage.setItem('lala_sw_reload_ts', String(Date.now()));
          window.location.reload();
        };

        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_UPDATED_FORCE_RELOAD' && event.data.hadLegacyCache) {
            reloadOnceForUpdate();
          }
        });

        window.addEventListener('load', async () => {
          try {
            if ('caches' in window) {
              const names = await caches.keys();
              let purgedAny = false;
              for (const name of names) {
                if (
                  name !== CURRENT_SW_VERSION &&
                  name !== 'casa-da-lala-fonts-v4' &&
                  (name.includes('workbox') || name.includes('casa-da-lala-offline'))
                ) {
                  await caches.delete(name);
                  purgedAny = true;
                }
              }
              const savedVer = localStorage.getItem('casa_lala_sw_version');
              localStorage.setItem('casa_lala_sw_version', CURRENT_SW_VERSION);
              if (purgedAny && savedVer && savedVer !== CURRENT_SW_VERSION) {
                reloadOnceForUpdate();
                return;
              }
            }

            const reg = await navigator.serviceWorker.register('/sw.js?v=14', {
              scope: '/',
              updateViaCache: 'none',
            });
            reg.update();
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              }
            });
          } catch (err) {
            console.debug('Service Worker registration fallback:', err);
          }
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then((reg) => {
              if (reg) reg.update();
            });
          }
        });
      }
    </script>
  </body>
</html>
